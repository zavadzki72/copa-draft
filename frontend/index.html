  <!-- Apply the saved (or system) theme BEFORE first paint to avoid a flash.
       The definitive theme state is owned by app.jsx; this only pre-sets the
       data-theme attribute the CSS tokens key off. -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('copa_draft_profile_v1') || '{}');
        var t = (p && (p.theme === 'light' || p.theme === 'dark')) ? p.theme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
