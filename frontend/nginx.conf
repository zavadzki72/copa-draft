server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip pra reduzir o peso do JS/CSS/JSX
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Não cachear o HTML (pra pegar deploys novos na hora)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Os .jsx são transpilados no browser pelo Babel; servir como JS.
    location ~* \.jsx$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # Multiplayer: API REST do backend (.NET)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Multiplayer: SignalR (WebSocket) — exige o upgrade de conexão
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
