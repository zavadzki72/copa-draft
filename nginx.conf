server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip pra reduzir o peso do JS/CSS/JSX
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Não cachear o HTML (pra pegar deploys novos na hora)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Os .jsx são transpilados no browser pelo Babel; servir como JS.
    location ~* \.jsx$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
