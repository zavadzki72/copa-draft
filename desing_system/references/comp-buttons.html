<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Green / yellow / ghost pills" viewport="700x160" --><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn{font-family:var(--font-sans);font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;transition:all .3s var(--ease-smooth)}
  .pill-green{background:var(--green);color:var(--on-green);border-radius:50px;padding:12px 26px;font-size:15px}
  .pill-green:hover{background:var(--green-bright);box-shadow:0 4px 15px rgba(0,168,89,.3);transform:translateY(-2px)}
  .pill-yellow{background:var(--yellow);color:var(--on-yellow);border-radius:50px;padding:12px 26px;font-size:15px;font-weight:700}
  .pill-yellow:hover{box-shadow:0 4px 15px rgba(255,223,0,.3);transform:translateY(-2px)}
  .ghost{background:transparent;color:var(--green-bright);border:1px solid rgba(0,168,89,.4)!important;border-radius:50px;padding:11px 24px;font-size:15px}
  .ghost:hover{background:rgba(0,168,89,.1);border-color:var(--green)!important}
</style></head>
<body>
<div class="lbl">Buttons — pill</div>
<div class="row">
  <button class="btn pill-green">Ver jogos</button>
  <button class="btn pill-yellow">Comprar ingressos</button>
  <button class="btn ghost">Ver mais →</button>
</div>
<div class="sub">Primary green · key-CTA yellow (near-black text, used sparingly) · ghost outline. Hover lifts 2px + glow.</div>
</body></html>
