<!DOCTYPE html>
<!-- @dsCard group="Components" name="Theme toggle" subtitle="Sun / moon switch — elastic, flips dark ↔ light" viewport="700x360" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  /* Theme colors snap instantly on data-theme flip (transitioning a
     var()-driven property pins it in this engine). The elastic flourish
     lives on the knob / icon, driven by a LOCAL .is-light class. */
  .tt-grid{display:flex;flex-direction:column;gap:20px}
  .tt-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .tt-tag{font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:88px;flex:none}

  /* ---- A. pill switch with sliding knob ---- */
  .theme-sw{position:relative;width:74px;height:34px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--surface-2);cursor:pointer;padding:0;flex:none;transition:background .4s var(--ease-smooth),border-color .4s var(--ease-smooth)}
  .theme-sw .ico{position:absolute;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg3);transition:color .4s var(--ease-smooth)}
  .theme-sw .ico.sun{left:9px}
  .theme-sw .ico.moon{right:9px}
  .theme-sw .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--green);box-shadow:var(--glow-green);transform:translateX(0)}
  .theme-sw.is-light .knob{transform:translateX(40px)}
  .theme-sw.armed.is-light .knob{animation:knob-on .55s var(--ease-elastic-4)}
  .theme-sw.armed:not(.is-light) .knob{animation:knob-off .5s var(--ease-elastic-4)}
  @keyframes knob-on{from{transform:translateX(0)}to{transform:translateX(40px)}}
  @keyframes knob-off{from{transform:translateX(40px)}to{transform:translateX(0)}}
  [data-theme="light"] .theme-sw .ico.sun{color:var(--green-bright)}
  .theme-sw .ico.moon{color:var(--green-bright)}
  [data-theme="light"] .theme-sw .ico.moon{color:var(--fg3)}

  /* ---- B. icon button (morphing) ---- */
  .theme-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--hairline);background:var(--surface-2);color:var(--green-bright);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:all .4s var(--ease-pop)}
  .theme-btn:hover{border-color:rgba(0,168,89,.5);box-shadow:var(--glow-green);transform:translateY(-2px)}
  .theme-btn svg{width:20px;height:20px}
  .theme-btn.armed.is-light svg,.theme-btn.armed:not(.is-light) svg{animation:icon-pop .5s var(--ease-elastic-4)}
  @keyframes icon-pop{0%{transform:scale(.5) rotate(-90deg);opacity:.4}100%{transform:none;opacity:1}}
  .theme-btn .moon{display:block}
  .theme-btn .sun{display:none}
  .theme-btn.is-light .moon{display:none}
  .theme-btn.is-light .sun{display:block}

  /* ---- C. label hint ---- */
  .tt-state{font-family:var(--font-mono);font-size:12px;color:var(--green-bright)}
  .tt-state::before{content:'data-theme="';opacity:.55}
  .tt-state::after{content:'"';opacity:.55}

  /* ---- live mini sample that re-themes ---- */
  .tt-sample{margin-top:6px;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-card);background:var(--surface-1);border:1px solid var(--hairline);transition:background .5s var(--ease-smooth),border-color .5s var(--ease-smooth)}
  .tt-sample .swp{width:38px;height:38px;border-radius:10px;flex:none}
  .tt-sample .s-green{background:var(--green)}
  .tt-sample .s-yellow{background:var(--yellow)}
  .tt-sample .s-blue{background:var(--blue)}
  .tt-sample .txt{display:flex;flex-direction:column;gap:3px;margin-right:auto}
  .tt-sample .txt .tk{font-family:var(--font-mono);font-size:12px;color:var(--green-bright);font-weight:500}
  .tt-sample .txt .ty{font-size:13px;color:var(--fg2)}
  .tt-sample .mini-btn{font-family:var(--font-sans);font-weight:600;font-size:13px;border:none;border-radius:var(--r-pill);padding:9px 18px;background:var(--green);color:var(--on-green);cursor:pointer;flex:none}
</style></head>
<body>
<div class="lbl">Theme toggle — sun / moon</div>
<div class="tt-grid">

  <div class="tt-row">
    <span class="tt-tag">pill switch</span>
    <button class="theme-sw" data-toggle aria-label="Toggle theme">
      <svg class="ico sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ico moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="knob"></span>
    </button>
    <span class="tt-state" data-state>dark</span>
  </div>

  <div class="tt-row">
    <span class="tt-tag">icon button</span>
    <button class="theme-btn" data-toggle aria-label="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="tt-sample">
    <div class="swp s-green"></div>
    <div class="swp s-yellow"></div>
    <div class="swp s-blue"></div>
    <div class="txt"><span class="tk">:tema</span><span class="ty">Surfaces, text &amp; accents re-tune live</span></div>
    <button class="mini-btn">Ver jogos</button>
  </div>
</div>

<script>
  let dark = true;
  function apply() {
    if (dark) document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', 'light');
    document.querySelectorAll('[data-state]').forEach(s => s.textContent = dark ? 'dark' : 'light');
    // elastic flourish driven by a local class (not the var()-mutating body)
    document.querySelectorAll('.theme-sw, .theme-btn').forEach(el => el.classList.toggle('is-light', !dark));
  }
  document.querySelectorAll('[data-toggle]').forEach(b => {
    b.addEventListener('click', () => {
      dark = !dark;
      document.querySelectorAll('.theme-sw, .theme-btn').forEach(el => el.classList.add('armed'));
      apply();
    });
  });
</script>
</body></html>
