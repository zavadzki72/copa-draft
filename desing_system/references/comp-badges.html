<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges & chips" subtitle="Status badges + filter chips" viewport="700x160" --><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .b-green{background:rgba(0,168,89,.15);color:var(--green-bright);border:1px solid rgba(0,168,89,.3)}
  .b-yellow{background:rgba(255,223,0,.14);color:var(--yellow);border:1px solid rgba(255,223,0,.3)}
  .b-blue{background:rgba(37,99,235,.16);color:var(--blue-bright);border:1px solid rgba(37,99,235,.4)}
  .b-mute{background:rgba(156,163,175,.1);color:var(--fg2);border:1px solid rgba(156,163,175,.3)}
  .chip{padding:6px 14px;border-radius:50px;font-size:13px;font-weight:500;background:var(--surface-2);border:1px solid var(--hairline);color:var(--fg2)}
  .chip.on{background:var(--surface-3);color:var(--fg1);border-color:rgba(0,168,89,.5)}
</style></head>
<body>
<div class="lbl">Badges &amp; chips</div>
<div class="row">
  <span class="badge b-green">Ao vivo</span>
  <span class="badge b-yellow">Final</span>
  <span class="badge b-blue">Grupo G</span>
  <span class="badge b-mute">Em breve</span>
</div>
<div class="row">
  <span class="chip on">Todos</span>
  <span class="chip">Brasil</span>
  <span class="chip">Oitavas</span>
  <span class="chip">Quartas</span>
</div>
</body></html>
